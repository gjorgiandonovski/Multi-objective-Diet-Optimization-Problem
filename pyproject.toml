[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diet-bao"
version = "0.1.0"
description = "BAO-style rebuild for multi-objective diet optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "inspyred",
    "python-dotenv",
    "mysql-connector-python",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["diet_bao*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
